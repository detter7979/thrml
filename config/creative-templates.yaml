      TAGLINE_EYEBROW: "PRIVATE WELLNESS, BY THE HOUR."
      SUBHEAD: "Backyard and cabin saunas in Seattle + LA."
    svg_variations:
      - variation_label: A
        tokens:
          HEADLINE: "Turn your idle sauna into income."
      - variation_label: B
        tokens:
          HEADLINE: "Let your sauna pay its own electric bill."
      - variation_label: C
        tokens:
          HEADLINE: "Earn while you recover."

  - id: T6
    label: "POV Overlay — Static (SVG)"
    type: static
    category: Hosts
    angle: pov_earnings
    formats: ["1x1", "4x5", "9x16"]
    default_variations: 1
    concept_verify_default: true
    full_batch_variations: 3
    generation_tool: svg_template
    svg_template_id: thrml_pov_overlay_static
    naming:
      test_id: T05
      format: Static_1x1
      cta: list_now
    defaults:
      trigger_type: manual
      hypothesis: "POV overlay SVG template with library photo background."
      hook: "pov: your sauna earns you $1,200/mo"
      campaign_short_name: pov-earnings
    svg_variations:
      - variation_label: A
        tokens:
          POV_LINE_1: "pov: your sauna earns you $1,200/mo"
          POV_LINE_2: "List on thrml. Get paid when you're not using it."
      - variation_label: B
        tokens:
          POV_LINE_1: "pov: stop letting your sauna sit idle"
          POV_LINE_2: "Hosts earn an average of $1,200 / month."
      - variation_label: C
        tokens:
          POV_LINE_1: "pov: your backyard wellness asset"
          POV_LINE_2: "Turn downtime into income on thrml."

  - id: T7
    label: "Block Split — Static (SVG)"
    type: static
    category: Hosts
    angle: pov_earnings
    formats: ["1x1", "4x5", "9x16"]
    default_variations: 1
    concept_verify_default: true
    full_batch_variations: 3
    generation_tool: svg_template
    svg_template_id: thrml_block_split_static
    naming:
      test_id: T05
      format: Static_9x16
      cta: list_now
    defaults:
      trigger_type: manual
      hypothesis: "Vrbo-style 50/50 block split — brand color top, photo bottom."
      hook: "Host earnings block split"
      campaign_short_name: pov-earnings
    svg_tokens:
      TAGLINE_EYEBROW: "PRIVATE WELLNESS, BY THE HOUR."
      SUBHEAD: "Backyard and cabin saunas in Seattle + LA."
    svg_variations:
