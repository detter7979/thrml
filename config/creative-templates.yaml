# thrml creative concept presets (T1–T5)
# Used by admin Creative Pipeline "New from template" intake.

version: 1

templates:
  - id: T1
    label: "POV Earns — Photo + Text"
    short_label: "POV Earns"
    description: "AI sauna photo with Master Ad overlay (logo, eyebrow, headline, proof line)."
    group: static_photo
    type: static
    category: Hosts
    angle: pov_earnings
    static_playbook: host_monetization_v3
    formats: ["1x1", "9x16", "4x5"]
    default_variations: 1
    concept_verify_default: true
    full_batch_variations: 3
    naming:
      test_id: T05
      format: Static_9x16
      cta: list_now
      template_slug: pov_earns_photo
    defaults:
      trigger_type: manual
      hypothesis: "Host POV earnings angle converts idle sauna owners."
      target_audience: "Homeowners with private sauna or cold plunge in PNW metros"
      hook: "Turn your idle sauna into income."
      copy_primary: "List your private sauna on thrml and earn when you're not using it."
      copy_headline: "Turn your idle sauna into income."
      copy_subtext: "Hosts on thrml earn an average of $1,200 / month."
      cta: "List Your Space"
      visual_direction: "Close exterior detail of a cedar barrel sauna on a Pacific Northwest deck, natural grain and stainless hardware, soft overcast light, 85mm shallow depth of field, editorial residential photography, no text, no logos, no people"
      campaign_short_name: pov-earnings
    static_variations:
      - variation_label: A
        headline: "Turn your idle sauna into income."
        background_image_prompt: "Close exterior detail of a cedar barrel sauna on a residential Pacific Northwest deck, vertical staves and brushed stainless door hardware in sharp focus, natural cedar grain with subtle knots, soft overcast afternoon light, 85mm lens shallow depth of field"
      - variation_label: B
        headline: "Let your sauna pay its own electric bill."
        background_image_prompt: "High-end residential backyard wellness setup with compact Nordic sauna cabin beside a cedar cold plunge tub, wet stone pavers, dense evergreens beyond a cedar fence, even overcast daylight, believable private home"
      - variation_label: C
        headline: "Earn while you recover."
        background_image_prompt: "Indoor infrared sauna with matte black glass frame in a modern home gym, one folded towel on the bench, even natural window light, authentic lived-in gym not a showroom"

  - id: T2
    label: "POV Sauna — Upload MP4"
    short_label: "POV Sauna (Upload)"
    description: "Your POV sauna MP4 from Runway (or any source) + centered overlay copy composited by the worker."
    group: video_pov
    recommended: true
    type: video
    category: Hosts
    angle: pov_earnings
    formats: ["9x16"]
    default_variations: 2
    concept_verify_default: true
    full_batch_variations: 3
    naming:
      test_id: T05
      format: Video_15s
      cta: list_now
      template_slug: pov_sauna_upload
    defaults:
      trigger_type: manual
      hypothesis: "Pre-uploaded POV b-roll with copy overlay — create base video in Runway, upload MP4, then generate variants here."
      hook: "pov: you turned your idle sauna into income"
      campaign_short_name: pov-earnings
    video:
      source: uploaded
      concept_slug: pov-earnings
      asset_slug: sauna
      template_version: 2
      copy_variants:
        - slug: pov-idle-income
          copy: "pov: you turned your idle sauna\ninto income"
          variant: A
        - slug: pov-earn-idle
          copy: "pov: stop letting your sauna sit idle"
          variant: B

  - id: T3
    label: "Split Header — Photo + Text"
    short_label: "Split Header"
    description: "Full-bleed photo with top scrim, logo, eyebrow, headline, and subhead."
    group: static_svg
    type: static
    category: Hosts
    angle: pov_earnings
    formats: ["1x1", "4x5", "9x16"]
    default_variations: 1
    concept_verify_default: true
    full_batch_variations: 3
    generation_tool: svg_template
    svg_template_id: thrml_split_header_static
    naming:
      test_id: T05
      format: Static_1x1
      cta: list_now
      template_slug: split_header
    defaults:
      trigger_type: manual
      hypothesis: "Split-header SVG template for host POV earnings."
      hook: "Host earnings split header"
      campaign_short_name: pov-earnings
    svg_tokens:
      TAGLINE_EYEBROW: "PRIVATE WELLNESS, BY THE HOUR."
      SUBHEAD: "Backyard and cabin saunas in Seattle + LA."
    svg_variations:
      - variation_label: A
        tokens:
          HEADLINE: "Turn your idle sauna into income."
      - variation_label: B
        tokens:
          HEADLINE: "Let your sauna pay its own electric bill."
      - variation_label: C
        tokens:
          HEADLINE: "Earn while you recover."

  - id: T4
    label: "Block Split — Orange + Photo"
    short_label: "Block Split"
    description: "Vrbo-style orange top block with copy; photo fills the bottom half."
    group: static_svg
    type: static
    category: Hosts
    angle: pov_earnings
    formats: ["1x1", "4x5", "9x16"]
    default_variations: 1
    concept_verify_default: true
    full_batch_variations: 3
    generation_tool: svg_template
    svg_template_id: thrml_block_split_static
    naming:
      test_id: T05
      format: Static_9x16
      cta: list_now
      template_slug: block_split
    defaults:
      trigger_type: manual
      hypothesis: "Vrbo-style 50/50 block split — brand color top, photo bottom."
      hook: "Host earnings block split"
      campaign_short_name: pov-earnings
    svg_tokens:
      TAGLINE_EYEBROW: "PRIVATE WELLNESS, BY THE HOUR."
      SUBHEAD: "Backyard and cabin saunas in Seattle + LA."
    svg_variations:
      - variation_label: A
        tokens:
          HEADLINE: "Turn your idle sauna into income."
      - variation_label: B
        tokens:
          HEADLINE: "Let your sauna pay its own electric bill."
      - variation_label: C
        tokens:
          HEADLINE: "Earn while you recover."

  - id: T5
    label: "Block Split — Upload MP4"
    short_label: "Block Split (Video)"
    description: "Same orange block + copy as T4 static; upload MP4 for the bottom half instead of a photo."
    group: video_block
    type: video
    category: Hosts
    angle: pov_earnings
    formats: ["9x16"]
    default_variations: 2
    concept_verify_default: true
    full_batch_variations: 3
    naming:
      test_id: T05
      format: Video_15s
      cta: list_now
      template_slug: block_split_video
    defaults:
      trigger_type: manual
      hypothesis: "Block split layout with uploaded b-roll in the bottom panel — pair with T4 static for A/B format tests."
      hook: "Turn your idle sauna into income."
      copy_headline: "Turn your idle sauna into income."
      campaign_short_name: pov-earnings
    svg_tokens:
      TAGLINE_EYEBROW: "PRIVATE WELLNESS, BY THE HOUR."
      SUBHEAD: "Backyard and cabin saunas in Seattle + LA."
    video:
      source: uploaded
      layout: block_split
      concept_slug: pov-earnings
      asset_slug: block-split
      template_version: 3
      copy_variants:
        - slug: block-idle-income
          variant: A
          headline: "Turn your idle sauna into income."
        - slug: block-sauna-bill
          variant: B
          headline: "Let your sauna pay its own electric bill."

svg_templates:
  - id: thrml_split_header_static
    label: "Split Header"
    tokens: [TAGLINE_EYEBROW, HEADLINE, SUBHEAD, PHOTO_URL]
    aspect_ratios: ["1x1", "4x5", "9x16"]
  - id: thrml_block_split_static
    label: "Block Split"
    tokens: [TAGLINE_EYEBROW, HEADLINE, SUBHEAD, PHOTO_URL]
    aspect_ratios: ["1x1", "4x5", "9x16"]
