<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>thrml | Offline</title>
<!--
  Bundled in the iOS app and shown when usethrml.com can't load (Capacitor server.errorPath).
  Self-contained: no network, no web fonts. Keep in step with src/components/native/OfflineScreen.tsx.
-->
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #F7F3EE; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top) 32px env(safe-area-inset-bottom);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    color: #1A1410; text-align: center; -webkit-font-smoothing: antialiased;
  }
  svg { width: min(72vw, 280px); height: auto; }
  .eyebrow { margin: 24px 0 0; font-size: 11px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: #C75B3A; }
  h1 { margin: 12px 0 0; max-width: 320px; font-family: "DM Serif Display", Georgia, "Times New Roman", serif; font-weight: 400; font-size: 32px; line-height: 1.1; }
  p.body { margin: 12px 0 0; max-width: 320px; font-size: 15px; line-height: 24px; color: #7A6355; }
  button {
    margin-top: 32px; width: 100%; max-width: 320px; height: 48px; border: 0; border-radius: 999px;
    background: #C75B3A; color: #fff; font: 500 16px/1 inherit; font-family: inherit; cursor: pointer;
  }
  button:active { background: #A8472B; }
  .note { margin: 12px 0 0; height: 20px; font-size: 14px; color: #7A6355; }
  .wordmark { position: absolute; bottom: calc(24px + env(safe-area-inset-bottom)); font-family: "DM Serif Display", Georgia, serif; font-size: 20px; color: rgba(26,20,16,0.4); }
  .offline-wisp { animation: offline-rise 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
        .offline-wisp-2 { animation-delay: 1.6s; }
        .offline-signal-lost { animation: offline-flicker 2.4s steps(1) infinite; }
        .offline-window { animation: offline-ember 3.6s ease-in-out infinite; }
        @keyframes offline-rise { 0% { opacity: 0; transform: translateY(6px) scaleY(0.8); } 35% { opacity: 1; } 100% { opacity: 0; transform: translateY(-14px) scaleY(1.1); } }
        @keyframes offline-flicker { 0%, 60% { opacity: 0.35; } 61%, 70% { opacity: 0; } 71%, 100% { opacity: 0.2; } }
        @keyframes offline-ember { 0%, 100% { opacity: 1; } 50% { opacity: 0.78; } }
        @media (prefers-reduced-motion: reduce) { .offline-wisp, .offline-signal-lost, .offline-window { animation: none; } }
</style>
</head>
<body>
  <svg viewBox="0 0 240 200" aria-hidden="true" width="260">
      <defs>
        <radialGradient id="offline-glow" cx="50%" cy="62%" r="55%">
          <stop offset="0%" stop-color="#FFE8DC" />
          <stop offset="100%" stop-color="#F7F3EE" stop-opacity="0" />
        </radialGradient>
      </defs>
      <ellipse cx="120" cy="128" rx="112" ry="70" fill="url(#offline-glow)" />
      
      <g fill="none" stroke="#C75B3A" stroke-linecap="round" class="offline-signal">
        <path d="M150 52 a10 10 0 0 1 14 0" stroke-width="5" />
        <path d="M143 43 a20 20 0 0 1 28 0" stroke-width="5" opacity="0.55" />
        <path d="M136 33 a30 30 0 0 1 42 0" stroke-width="5" stroke-dasharray="4 9" class="offline-signal-lost" />
      </g>
      
      <g fill="none" stroke="#DDD4C8" stroke-width="4" stroke-linecap="round">
        <path class="offline-wisp offline-wisp-1" d="M157 70 c-6 -8 6 -12 0 -20" />
        <path class="offline-wisp offline-wisp-2" d="M168 72 c-6 -8 6 -12 0 -20" />
      </g>
      
      <rect x="154" y="70" width="16" height="22" rx="2" fill="#1A1410" />
      
      <g>
        <rect x="44" y="88" width="152" height="74" rx="37" fill="#A8472B" />
        <rect x="50" y="94" width="140" height="62" rx="31" fill="#C75B3A" />
        <line x1="66" y1="96" x2="66" y2="154" stroke="#A8472B" stroke-width="2" opacity="0.55"/><line x1="82" y1="96" x2="82" y2="154" stroke="#A8472B" stroke-width="2" opacity="0.55"/><line x1="98" y1="96" x2="98" y2="154" stroke="#A8472B" stroke-width="2" opacity="0.55"/><line x1="114" y1="96" x2="114" y2="154" stroke="#A8472B" stroke-width="2" opacity="0.55"/><line x1="130" y1="96" x2="130" y2="154" stroke="#A8472B" stroke-width="2" opacity="0.55"/><line x1="146" y1="96" x2="146" y2="154" stroke="#A8472B" stroke-width="2" opacity="0.55"/><line x1="162" y1="96" x2="162" y2="154" stroke="#A8472B" stroke-width="2" opacity="0.55"/><line x1="178" y1="96" x2="178" y2="154" stroke="#A8472B" stroke-width="2" opacity="0.55"/>
        <rect x="51" y="104" width="138" height="5" fill="#1A1410" opacity="0.8" />
        <rect x="48" y="141" width="144" height="5" fill="#1A1410" opacity="0.8" />
        
        <rect x="100" y="108" width="40" height="48" rx="6" fill="#7A3420" />
        <rect x="108" y="116" width="24" height="16" rx="3" fill="#FFB98F" class="offline-window" />
      </g>
      
      <rect x="28" y="160" width="184" height="8" rx="4" fill="#DDD4C8" />
    </svg>
  <p class="eyebrow">You're offline</p>
  <h1>Lost the signal, not the heat.</h1>
  <p class="body">Your bookings and messages are safe. Reconnect to Wi-Fi or cellular and we'll pick up right where you left off.</p>
  <button type="button" id="retry">Try again</button>
  <p class="note" id="note" aria-live="polite"></p>
  <p class="wordmark">thrml</p>
<script>
  var SITE = "https://usethrml.com";
  function go() { window.location.replace(SITE); }
  document.getElementById("retry").addEventListener("click", function () {
    if (navigator.onLine) { go(); return; }
    var note = document.getElementById("note");
    note.textContent = "Still no connection. Give it a moment.";
    setTimeout(function () { note.textContent = ""; }, 2200);
  });
  window.addEventListener("online", go);
</script>
</body>
</html>
